  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #07090E;
      --card: #0F141F;
      --border: #1E2738;
      --primary: #3B82F6;
      --accent: #10B981;
      --danger: #EF4444;
      --text: #F3F4F6;
      --text-muted: #94A3B8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Plus Jakarta Sans', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    header {
      background: var(--card);
      border-bottom: 1px solid var(--border);
      padding: 12px 28px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .brand { display: flex; align-items: center; gap: 12px; }
    .brand-logo {
      width: 36px; height: 36px;
      background: linear-gradient(135deg, #10B981, #3B82F6);
      border-radius: 9px;
      display: flex; align-items: center; justify-content: center;
      font-weight: 800; color: white;
      font-size: 1.1rem;
    }
    .brand-title { font-size: 1.1rem; font-weight: 700; letter-spacing: -0.5px; }
    .badge {
      font-size: 0.72rem;
      background: #064E3B;
      color: #34D399;
      padding: 3px 9px;
      border-radius: 12px;
      font-weight: 700;
      border: 1px solid #059669;
    }
    .btn {
      padding: 8px 16px;
      border-radius: 8px;
      font-size: 0.86rem;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      border: 1px solid transparent;
      transition: all 0.15s ease;
    }
    .btn-primary { background: var(--primary); color: white; }
    .btn-primary:hover { background: #2563EB; }
    .btn-success { background: var(--accent); color: white; }
    .btn-success:hover { background: #059669; }
    .btn-danger { background: var(--danger); color: white; }
    .btn-outline { background: #1E293B; border-color: var(--border); color: var(--text); }
    .btn-outline:hover { background: #283548; }

    main {
      flex: 1;
      max-width: 1560px;
      margin: 0 auto;
      width: 100%;
      padding: 20px 24px;
      display: grid;
      grid-template-columns: minmax(0, 1fr) 420px;
      gap: 24px;
    }

    main > div:first-child {
      min-width: 0;
    }

    .video-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.6);
      min-width: 0;
      overflow: hidden;
    }

    /* 16:9 Widescreen Master Canvas */
    .viewport {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 9;
      background: #05070B;
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 15px 50px rgba(0,0,0,0.9);
      isolation: isolate;
      perspective: 1200px;
      container-type: inline-size;
      container-name: viewport;
    }

    /* Layer 1: Ambient Scene-Matched Blurred Background */
    .bg-layer {
      position: absolute;
      inset: -50px;
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      filter: blur(45px) brightness(0.68) saturate(1.4);
      transform: scale(1.15);
      transition: background-image 0.5s ease-in-out;
      z-index: 1;
    }

    /* Subtle Cinematic Vignette */
    .vignette {
      position: absolute;
      inset: 0;
      background: radial-gradient(ellipse at center, rgba(5,7,11,0.15) 0%, rgba(5,7,11,0.82) 100%);
      z-index: 2;
      pointer-events: none;
    }

    /* Layer 2: Dual 9:16 Vertical Panels with 160px Center Gap */
    .panels-container {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: clamp(16px, 11cqw, 160px);
      overflow: hidden;
      z-index: 5;
    }

    .panel-card {
      height: 92%;
      aspect-ratio: 9 / 16;
      border-radius: 10px;
      overflow: hidden;
      box-shadow: 0 20px 50px rgba(0,0,0,0.95), 0 0 25px rgba(0,0,0,0.7);
      border: 1px solid rgba(255, 255, 255, 0.16);
      background: #000;
      position: relative;
      will-change: transform;
    }

    .panel-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transition: opacity 0.3s ease;
      will-change: transform;
    }

    /* Layer 3: Full-Screen Campfire Sparks across Left, Middle Gap, and Right */
    .fire-layer-full {
      position: absolute;
      bottom: -10px;
      left: 0;
      right: 0;
      height: clamp(160px, 45cqw, 500px);
      pointer-events: none;
      z-index: 22;
      mix-blend-mode: screen;
      overflow: hidden;
    }

    .fire-ember-track {
      position: absolute;
      inset: 0;
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
    }

    .camp-ember-full {
      height: 100%;
      min-width: 52%;
      object-fit: cover;
      pointer-events: none;
      opacity: 0.98;
      filter: brightness(1.4) contrast(1.2);
    }

    .camp-ember-center {
      position: absolute;
      left: 50%;
      bottom: 0px;
      transform: translateX(-50%);
      height: 100%;
      width: clamp(260px, 80cqw, 960px);
      object-fit: cover;
      pointer-events: none;
      opacity: 1;
      filter: brightness(1.45) contrast(1.25);
    }

    /* Whiteout Impact Flash Layer */
    .flash-layer {
      position: absolute;
      inset: 0;
      background: #FFF;
      opacity: 0;
      pointer-events: none;
      z-index: 25;
      transition: opacity 0.12s ease;
    }

    /* Layer 4: Masked Podcast Host Avatar with Black Smoke Screen on All Sides */
    .host-smoke-back {
      position: absolute;
      bottom: -15px;
      right: -10px;
      width: clamp(140px, 32cqw, 440px);
      height: clamp(90px, 20cqw, 280px);
      background: radial-gradient(ellipse at 50% 50%, rgba(5, 7, 11, 1) 32%, rgba(5, 7, 11, 0.88) 62%, transparent 100%);
      filter: blur(28px);
      pointer-events: none;
      z-index: 28;
    }

    .host-avatar-box {
      position: absolute;
      bottom: clamp(6px, 1.8cqw, 20px);
      right: clamp(8px, 2.2cqw, 25px);
      width: clamp(100px, 23cqw, 320px);
      aspect-ratio: 320 / 185;
      border-radius: clamp(10px, 2cqw, 26px);
      overflow: hidden;
      border: none;
      background: transparent;
      z-index: 30;
      -webkit-mask-image: radial-gradient(ellipse at 55% 55%, rgba(0,0,0,1) 35%, rgba(0,0,0,0.85) 58%, rgba(0,0,0,0.3) 80%, rgba(0,0,0,0) 100%);
      mask-image: radial-gradient(ellipse at 55% 55%, rgba(0,0,0,1) 35%, rgba(0,0,0,0.85) 58%, rgba(0,0,0,0.3) 80%, rgba(0,0,0,0) 100%);
    }

    .host-avatar-box video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .host-avatar-box::after {
      content: '';
      position: absolute;
      inset: 0;
      background: radial-gradient(ellipse at 55% 55%, transparent 40%, rgba(5,7,11,0.5) 65%, rgba(5,7,11,0.95) 98%);
      pointer-events: none;
    }

    /* External Studio Controls */
    .controls {
      margin-top: 16px;
      background: #080B12;
      padding: 14px 18px;
      border-radius: 8px;
      border: 1px solid var(--border);
    }
    .control-row {
      display: flex;
      align-items: center;
      gap: 16px;
    }
    .time-lbl {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.88rem;
      color: var(--text-muted);
      min-width: 120px;
    }
    .scrubber {
      flex: 1;
      accent-color: var(--primary);
      cursor: pointer;
      height: 6px;
    }
    .beat-pills {
      display: flex;
      gap: 6px;
      margin-top: 12px;
      overflow-x: auto;
      padding-bottom: 4px;
    }
    .beat-pill {
      font-size: 0.74rem;
      padding: 6px 11px;
      background: #141B29;
      color: #94A3B8;
      border-radius: 6px;
      cursor: pointer;
      white-space: nowrap;
      border: 1px solid #1E2738;
      transition: all 0.15s;
    }
    .beat-pill:hover { background: #1E293B; color: white; }
    .beat-pill.active {
      background: #1E3A8A;
      color: #93C5FD;
      border-color: #3B82F6;
      font-weight: 700;
    }

    /* Right Sidebar: Story Beats List */
    .sidebar-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      max-height: calc(100vh - 120px);
    }
    .card-title {
      font-size: 0.95rem;
      font-weight: 700;
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--border);
      padding-bottom: 12px;

    .timeline-item {

      background: #0A0D15;
      border: 1px solid #182030;
      margin-bottom: 10px;
      cursor: pointer;

      { id: 11, duration: 9.01, motion: 'slide_down', panelLeft: '003_p02.png', panelRight: 'beat_01.png', avatarPreset: 'Concerned.mp4', title: 'Shot 11: The Pure Dream', vo: "His entire dream was simple—to strip away the world's prejudice against the spear, stand beside his friend as the Empire's unbreakable shield, and live with honor." },
      { id: 12, duration: 7.63, motion: 'zoom_out', panelLeft: 'beat_04.png', panelRight: 'beat_03.png', avatarPreset: 'Explaining.mp4', title: 'Shot 12: Archmage Evergrant', vo: "But stepping into the clearing is a man wearing a pristine white cloak—the supreme Master of the Continental Magic Tower, Archmage Evergrant." },

      // ACT 2: EVERGRANT'S REVELATION & KAISER'S COLD DEPARTURE
      { id: 13, duration: 9.71, motion: 'zoom_in', panelLeft: 'beat_04.png', panelRight: 'beat_01.png', avatarPreset: 'Explaining.mp4', title: 'Shot 13: Anomaly to the State', vo: "Evergrant looks down at him like a disappointed professor, calmly explaining that in this cruel world, there are people whose sheer existence is a threat to the state." },
      { id: 14, duration: 7.63, motion: 'pan_left', panelLeft: 'beat_02.png', panelRight: '003_p07.png', avatarPreset: 'Serious.mp4', title: 'Shot 14: World Domination', vo: "With the civil war finished, nothing on the continent can challenge Kaiser's grand ambition to conquer the world—except for one single anomaly." },
      { id: 15, duration: 10.4, motion: 'slide_down', panelLeft: '003_p09.png', panelRight: 'beat_08.png', avatarPreset: 'Confident.mp4', title: 'Shot 15: Apocalyptic Mana', vo: "Most veteran knights spend forty years meditating just to coat a three-inch dagger in basic aura. But Joshua? Our boy was swinging a twelve-foot colossal spear coated in apocalyptic mana!" },
      { id: 16, duration: 10.05, motion: 'shake_slide', panelLeft: 'beat_04.png', panelRight: 'beat_05.png', avatarPreset: 'Serious.mp4', title: 'Shot 16: The Final Wall', vo: "Worse still, Evergrant knows the awful truth: Joshua secretly broke through the legendary mortal ceiling, achieving a realm of power where even emperors can be slaughtered in their sleep." },
      { id: 17, duration: 9.71, motion: 'zoom_in', panelLeft: 'beat_04.png', panelRight: 'beat_03.png', avatarPreset: 'Explaining.mp4', title: 'Shot 17: Relic of Amon', vo: "In the palm of his hand, the archmage cradles a mysterious grey sphere that radiates a sickeningly bright flare—a forbidden relic excavated from the ancient ruins of Amon." },
      { id: 18, duration: 11.09, motion: 'pan_left', panelLeft: 'beat_05.png', panelRight: 'beat_04.png', avatarPreset: 'Shocked.mp4', title: 'Shot 18: Calculated Execution', vo: "It is the only known medium that can simultaneously conduct opposing magic and holy energy. Joshua's mind reels—the expedition to Amon wasn't an imperial mission; it was prep work for his execution!" },
      { id: 19, duration: 7.28, motion: 'slide_down', panelLeft: 'beat_03.png', panelRight: 'beat_01.png', avatarPreset: 'Concerned.mp4', title: 'Shot 19: The Royal Guard', vo: "Next, a middle-aged knight in shimmering golden armor steps up, sporting the roaring dragon crest of Avalon's most elite royal bodyguard." },
      { id: 20, duration: 10.75, motion: 'zoom_in', panelLeft: 'beat_08.png', panelRight: 'beat_03.png', avatarPreset: 'Serious.mp4', title: 'Shot 20: Living Nightmare', vo: "The veteran admits with a nervous shudder that merely standing in the presence of Joshua's spear gave him chronic nightmares, convinced the peasant spearman would turn on them at any moment." },
      { id: 21, duration: 7.28, motion: 'slide_up_flash', panelLeft: 'beat_04.png', panelRight: 'beat_01.png', avatarPreset: 'Dramatic_Pause.mp4', title: 'Shot 21: Oscar Performance', vo: "Putting on an Oscar-worthy performance, Evergrant bows with theatrical humility, thanking Joshua for his service before giving him a polite farewell." },
      { id: 22, duration: 7.97, motion: 'zoom_in', panelLeft: 'beat_04.png', panelRight: 'beat_01.png', avatarPreset: 'Emphasizing.mp4', title: 'Shot 22: Mocking Derision', vo: "But as their eyes meet, Joshua catches the subtle smirk curling the corner of the archmage's mouth. It isn't sorrow—it's pure, disgusting mockery." },
      { id: 23, duration: 9.01, motion: 'pan_left', panelLeft: 'beat_02.png', panelRight: 'beat_06.png', avatarPreset: 'Serious.mp4', title: 'Shot 23: The Emperor Whispers', vo: "Then Kaiser speaks, whispering in a soft, trembling voice that he cannot bear to watch, yet feels obligated to witness the end of his dear companion." },
      { id: 24, duration: 11.09, motion: 'slide_down', panelLeft: 'beat_06.png', panelRight: 'beat_01.png', avatarPreset: 'Shocked.mp4', title: 'Shot 24: Peak Hypocrisy', vo: "The sheer hypocrisy makes our boy physically nauseous. The man who drank wine with him by the fire last night is now having him butchered in the woods like a rabid hound." },

      // ACT 3: THE 50-METER DESTRUCTION CIRCLE & DEMONIC RESURGENCE
      { id: 25, duration: 8.67, motion: 'slide_up_flash', panelLeft: '003_p06.png', panelRight: 'beat_01.png', avatarPreset: 'Shocked.mp4', title: 'Shot 25: Annihilation Runes', vo: "Right beneath his chest, massive red and violet runes ignite across the mossy floor—a high-grade strategic destruction circle designed to vaporize everything within fifty meters!" },
      { id: 26, duration: 10.4, motion: 'zoom_in', panelLeft: '003_p06.png', panelRight: 'beat_05.png', avatarPreset: 'Serious.mp4', title: 'Shot 26: 5-Minute Countdown', vo: "Joshua knows this formula well. At the rate the ambient mana is condensing, he has five minutes at most before the clearing detonates with the force of a falling meteor." },
      { id: 27, duration: 10.4, motion: 'pan_left', panelLeft: 'beat_07.png', panelRight: 'beat_06.png', avatarPreset: 'Emphasizing.mp4', title: 'Shot 27: Engraving the Traitors', vo: "In the face of certain death, panic disappears, replaced by an inferno of pure, cold hatred. He carves the faces of all five conspirators into his memory, engraving every wrinkle." },
      { id: 28, duration: 8.67, motion: 'shake_slide', panelLeft: 'beat_05.png', panelRight: 'beat_07.png', avatarPreset: 'Concerned.mp4', title: 'Shot 28: Suppressing Torment', vo: "Swallowing his own blood, he enters deep meditation, desperately attempting to suppress the feral beast of clashing divine and magical energies tearing through his organs." },
      { id: 29, duration: 10.05, motion: 'slide_down', panelLeft: 'beat_01.png', panelRight: '003_p06.png', avatarPreset: 'Serious.mp4', title: 'Shot 29: Biological Limit', vo: "What feels like two lifetimes of torment is only three minutes on the clock. His physical vessels are completely wrecked; the biological limit of his mortal frame has shattered." },
      { id: 30, duration: 8.67, motion: 'pulse_zoom', panelLeft: 'beat_08.png', panelRight: 'beat_01.png', avatarPreset: 'Confident.mp4', title: 'Shot 30: Dark Heartbeat', vo: "But right as his consciousness begins to fade into eternal blackness, a low, rhythmic vibration rings in his ears—a dark heartbeat calling out to him." },
      { id: 31, duration: 9.01, motion: 'zoom_in', panelLeft: 'beat_08.png', panelRight: '003_p01.png', avatarPreset: 'Confident.mp4', title: 'Shot 31: Lugia Awakens', vo: "Resting in the dirt a few feet away, Lugia radiates a menacing crimson pulse that defies all mortal magic. The weapon is awakening on its own!" },
      { id: 32, duration: 9.36, motion: 'pan_left', panelLeft: '003_p01.png', panelRight: '003_p09.png', avatarPreset: 'Explaining.mp4', title: 'Shot 32: Twenty Years of War', vo: "For two decades of relentless warfare, the spear had served him as an unyielding blade of iron, never revealing the dormant primordial demon sealed within its core." },
      { id: 33, duration: 8.32, motion: 'zoom_in', panelLeft: 'beat_08.png', panelRight: 'beat_07.png', avatarPreset: 'Emphasizing.mp4', title: 'Shot 33: Never Bow Your Knee', vo: "But now, bathed in his dying hatred, the spear screams with conscious fury, commanding its master not to bow his neck to these hypocrites!" },
      { id: 34, duration: 8.32, motion: 'shake_slide', panelLeft: 'beat_09.png', panelRight: 'beat_08.png', avatarPreset: 'Serious.mp4', title: 'Shot 34: Crawling Revenant', vo: "Moving like a possessed revenant, our boy chokes down the excruciating agony, clawing his fingers into the soil and dragging his shattered body forward." },
      { id: 35, duration: 8.32, motion: 'zoom_in', panelLeft: 'beat_09.png', panelRight: '003_p04.png', avatarPreset: 'Confident.mp4', title: 'Shot 35: Clamping the Shaft', vo: "With a final surge of willpower, his bloody hand firmly clamps around the spear's grip. A savage grin cuts across his lips—he made it." },
      { id: 36, duration: 7.97, motion: 'slide_up_flash', panelLeft: '003_p06.png', panelRight: '003_p04.png', avatarPreset: 'Shocked.mp4', title: 'Shot 36: Cataclysmic Blast', vo: "Right at that exact microsecond, the strategic circle reaches maximum capacity, detonating with an earth-shattering roar that levels the forest canopy into dust!" },

      // ACT 4: SPACE-TIME RIFT & REBIRTH IN THE BARN
      { id: 37, duration: 8.67, motion: 'slide_up_flash', panelLeft: '003_p06.png', panelRight: 'beat_08.png', avatarPreset: 'Explaining.mp4', title: 'Shot 37: Trinity of Absolute Forces', vo: "But instead of vaporizing his soul, the catastrophic collision of three absolute forces—holy light, ancient magic, and Lugia's demonic core—tears open a rift in space-time!" },
      { id: 38, duration: 6.59, motion: 'pan_left', panelLeft: '003_p06.png', panelRight: '003_p09.png', avatarPreset: 'Explaining.mp4', title: 'Shot 38: Sucked into the Vortex', vo: "Sucked into the temporal whirlpool, Joshua's adult consciousness hurtles backward through time, retaining every memory, battle, and technique intact." },
      { id: 39, duration: 8.67, motion: 'slide_down', panelLeft: 'beat_12.png', panelRight: '003_p06.png', avatarPreset: 'Questioning.mp4', title: 'Shot 39: Barn Straw & Manure', vo: "The blinding light fades, replaced by the pungent, familiar stench of dry straw and horse manure. Our boy opens his eyes, groaning in mild confusion." },
      { id: 40, duration: 9.01, motion: 'zoom_in', panelLeft: 'beat_13.png', panelRight: 'beat_12.png', avatarPreset: 'Shocked.mp4', title: 'Shot 40: Tiny Child Fingers', vo: "Looking down, he doesn't see the scarred, battle-hardened hands of a legendary grand duke. He is staring at the smooth, tiny fingers of a scrawny child!" },
      { id: 41, duration: 8.32, motion: 'pan_left', panelLeft: 'beat_12.png', panelRight: 'beat_13.png', avatarPreset: 'Questioning.mp4', title: 'Shot 41: Puddle Reflection', vo: "Scrambling out of the stables, he rushes over to a muddy puddle on the cobblestone path, staring down at his watery reflection in shock." },
      { id: 42, duration: 10.4, motion: 'zoom_in', panelLeft: 'beat_12.png', panelRight: 'beat_14.png', avatarPreset: 'Shocked.mp4', title: 'Shot 42: Regressed 30 Years', vo: "Staring back is the face of a nine-year-old boy with dark blue locks and deep indigo eyes. He hasn't just survived; he has regressed thirty years into his own childhood!" },
      { id: 43, duration: 9.01, motion: 'slide_down', panelLeft: 'beat_14.png', panelRight: '003_p02.png', avatarPreset: 'Concerned.mp4', title: 'Shot 43: House Agnus Quarters', vo: "He recognizes the grim stone walls around him—the outer servant quarters of House Agnus, where he and his concubine mother were discarded and shunned like vermin." },
      { id: 44, duration: 11.71, motion: 'zoom_in', panelLeft: 'beat_12.png', panelRight: 'beat_14.png', avatarPreset: 'Serious.mp4', title: 'Shot 44: Lucia is Alive', vo: "A sudden realization hits him like lightning: at this exact age, his mother Lucia is still alive. The woman who suffered in poverty for his sake is waiting for him in the cottage." },

    function switchChapter(chId) {

    function getActiveBeat(t) {
      let acc = 0;
      for (let i = 0; i < BEATS.length; i++) {
        if (t >= acc && t < (acc + BEATS[i].duration)) {
          return { beat: BEATS[i], index: i, localT: t - acc };
        }
        acc += BEATS[i].duration;
      }
      return { beat: BEATS[BEATS.length - 1], index: BEATS.length - 1, localT: BEATS[BEATS.length - 1].duration };
    }

    function updateVisuals(t) {

        // Switch host avatar preset video if changed

      if (beat.motion === 'slide_down') {
        // High-energy vertical slide down (140px total travel)

    function formatTime(s) {
      const m = Math.floor(s / 60);
      const sec = Math.floor(s % 60);
      return `${String(m).padStart(2, '0')}:${String(sec).padStart(2, '0')}`;
    }

    function togglePlay() {
      isPlaying = !isPlaying;
      const btn = document.getElementById('btn_play');
      const hostVideo = document.getElementById('host_video');
      const masterAudio = document.getElementById('master_audio');
      if (isPlaying) {
        btn.innerText = '⏸ Pause';
        btn.classList.remove('btn-primary');
        btn.classList.add('btn-danger');
        lastTime = performance.now();
        if (masterAudio) {
          const offset = (currentChapter && currentChapter.audioOffset) ? currentChapter.audioOffset : 0;
          masterAudio.currentTime = offset + currentTime;
          masterAudio.play().catch(() => {});
        }
        hostVideo.play().catch(() => {});
        animId = requestAnimationFrame(loop);
      } else {
        btn.innerText = '▶ Play ' + (currentChapter ? currentChapter.title.split(':')[0] : 'Video');
        btn.classList.remove('btn-danger');
        btn.classList.add('btn-primary');
        if (masterAudio) {
          masterAudio.pause();
        }
        hostVideo.pause();
        if (animId) cancelAnimationFrame(animId);
      }
    }

    function loop(now) {
      if (!isPlaying) return;
      const masterAudio = document.getElementById('master_audio');
      if (masterAudio && !masterAudio.paused && !masterAudio.seeking) {
        const offset = (currentChapter && currentChapter.audioOffset) ? currentChapter.audioOffset : 0;
        currentTime = Math.max(0, masterAudio.currentTime - offset);
      } else {
        const dt = (now - lastTime) / 1000;
        currentTime += dt;

        currentTime = 0;
        if (masterAudio) {
          masterAudio.currentTime = 0;
          masterAudio.pause();
        }
        togglePlay();
    
        return;

      updateVisuals(currentTime);
      animId = requestAnimationFrame(loop);
    }
